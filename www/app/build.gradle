apply plugin: 'com.android.application'

def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('keystore.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

def signingValue = { environmentName, propertyName ->
    System.getenv(environmentName) ?: keyProperties.getProperty(propertyName)
}
def releaseStore = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it != null && !it.isEmpty() }

android {
    namespace = 'com.neonbreaker.arcade'
    compileSdk = rootProject.ext.compileSdkVersion
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId 'com.neonbreaker.arcade'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (System.getenv('NEON_VERSION_CODE') ?: '1').toInteger()
        versionName (System.getenv('NEON_VERSION_NAME') ?: '1.0.0')
        manifestPlaceholders = [appLabel: 'Neon Breaker']
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-test'
            manifestPlaceholders = [appLabel: 'Neon Breaker Test']
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

// Never advertise an unsigned release APK as an installable application.
gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any {
        it.project == project && it.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle']
    }
    if (buildingRelease && !hasReleaseSigning) {
        throw new GradleException('Release signing is missing. Configure android/keystore.properties or ANDROID_KEYSTORE_* environment variables. See ANDROID.md.')
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'