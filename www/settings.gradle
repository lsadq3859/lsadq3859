rootProject.name = 'NeonBreaker'
include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

if (!file('capacitor.settings.gradle').exists()) {
    throw new GradleException('Run npm run build, then node scripts/prepare-android.mjs from the repository root first.')
}
apply from: 'capacitor.settings.gradle'